plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ec.ffmpeg'
    compileSdk 33

    defaultConfig {
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // FFmpegKit内嵌 - DEX自带FFmpeg能力，无需外部二进制
    implementation files('libs/ffmpeg-kit.aar')
}
